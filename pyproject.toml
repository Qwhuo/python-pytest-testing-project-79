[project]
name = "hexlet-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Polina Maksimovna", email = "polina.trofimova@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pytest",
    "bs4",
    "httpx",
    "pytest-cov>=7.1.0",
]

[project.scripts]
page-loader = "hexlet_code.scripts.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hexlet_code"]
